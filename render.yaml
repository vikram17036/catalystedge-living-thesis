# Render deployment configuration for StockSense Agent

services:
  # Backend API Service (Living Thesis Phase 1)
  - type: web
    name: catalystedge-backend
    runtime: python
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: NEWSAPI_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # Free plan has no persistent disk — use ephemeral path (cache is optional).
      - key: STOCKSENSE_DB_PATH
        value: /tmp/stocksense.db
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: 8000
    buildCommand: pip install --no-cache-dir -r requirements-backend.txt
    startCommand: uvicorn stocksense.main:app --host 0.0.0.0 --port $PORT

# NOTE: React frontend → Vercel (root directory = frontend).
# Set VITE_API_URL to this backend URL after first Render deploy.
# Set CORS_ORIGINS on Render to the Vercel URL (comma-separated if multiple).
# Free-tier tip: do not add a persistent disk; Blueprint will fail if you do.
